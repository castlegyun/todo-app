<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section id="auth" hidden>
      <h1>할 일</h1>
      <form id="auth-form">
        <input id="email" type="email" placeholder="이메일" autocomplete="email" required>
        <input id="password" type="password" placeholder="비밀번호 (6자 이상)" minlength="6" autocomplete="current-password" required>
        <div class="row">
          <button type="submit" id="login-btn">로그인</button>
          <button type="button" id="signup-btn" class="secondary">회원가입</button>
        </div>
      </form>
      <p id="auth-message" role="alert" hidden></p>
    </section>

    <section id="app" hidden>
      <header>
        <h1>할 일</h1>
        <div class="user">
          <span id="user-email"></span>
          <button type="button" id="logout-btn" class="secondary">로그아웃</button>
        </div>
      </header>

      <form id="add-form">
        <input id="title" type="text" placeholder="할 일을 입력하세요" maxlength="200" required autocomplete="off">
        <input id="due" type="date" aria-label="마감일">
        <button type="submit">추가</button>
      </form>

      <div class="tabs" role="group" aria-label="보기">
        <button type="button" id="tab-all" class="active" aria-pressed="true">전체</button>
        <button type="button" id="tab-today" aria-pressed="false">오늘 할 일만</button>
      </div>

      <p id="message" role="alert" hidden></p>
      <ul id="list"></ul>
      <p id="empty" hidden></p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
